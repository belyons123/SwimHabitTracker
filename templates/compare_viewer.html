{% extends "base.html" %}
{% block title %}Side-by-Side Comparison{% endblock %}

{% block content %}
<h1 class="mb-4">Side-by-Side Comparison</h1>

<div class="row">
    <div class="col-md-6">
        <h5>Your Video</h5>
        <video id="userVid" controls width="100%">
            <source src="{{ url_for('static', filename=user_video[2]) }}">
        </video>
    </div>

    <div class="col-md-6">
        <h5>Professional Video</h5>
        <video id="proVid" controls width="100%">
            <source src="{{ url_for('static', filename=pro_video[4]) }}">
        </video>
    </div>
</div>

<script>
    const userVid = document.getElementById("userVid");
    const proVid = document.getElementById("proVid");

    userVid.onplay = () => proVid.play();
    userVid.onpause = () => proVid.pause();
    userVid.onseeked = () => proVid.currentTime = userVid.currentTime;
</script>
{% endblock %}
